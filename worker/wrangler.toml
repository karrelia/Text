name = "voice2text-ua"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Сховище персональних налаштувань. id підставиться командою
#   npx wrangler kv namespace create SETTINGS
[[kv_namespaces]]
binding = "SETTINGS"
id = "ЗАМІНИТИ_НА_ID_З_КОМАНДИ_WRANGLER"

# Раз на хвилину бот перевіряє, чи не настав час якогось нагадування.
[triggers]
crons = ["* * * * *"]

[vars]
# Рушій розпізнавання за замовчуванням: groq | openai
STT_PROVIDER = "groq"
GROQ_WHISPER_MODEL = "whisper-large-v3"
OPENAI_WHISPER_MODEL = "whisper-1"

# Модель редагування тексту (через OpenRouter)
LLM_MODEL = "google/gemini-2.5-flash"

# Модель для читання тексту з фото (має приймати зображення)
VISION_MODEL = "google/gemini-2.5-flash"

# Часовий пояс для нагадувань. Перехід на літній час враховується сам.
TIMEZONE = "Europe/Kyiv"

# Типове місто для /weather. Кожен може змінити своє командою /city.
CITY = "Миргород"
LLM_TEMPERATURE = "0.2"

# Максимальна тривалість запису, секунд (0 = без ліміту)
MAX_AUDIO_SECONDS = "5400"

# Скільки чекати решту знімків альбому, мс. Telegram шле їх окремими
# оновленнями з розривом у сотні мілісекунд; більше — надійніше, але
# кожна сторінка альбому стільки й чекатиме.
ALBUM_WAIT_MS = "1500"

OPENROUTER_APP_URL = "https://github.com/karrelia/Text"
OPENROUTER_APP_TITLE = "Voice2Text UA Bot"

# Секрети задаються окремо, у код і git не потрапляють:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put WEBHOOK_SECRET
#
# Список дозволених Telegram ID теж секрет, а не змінна — інакше він
# лежав би в git і зникав при кожному оновленні коду:
#   npx wrangler secret put ALLOWED_USER_IDS
